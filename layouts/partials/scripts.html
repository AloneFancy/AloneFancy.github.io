{{- with resources.Get "retrocss/retro.min.js" -}}
  {{- $js := . -}}
  {{- if hugo.IsProduction }}{{ $js = $js | fingerprint "sha384" }}{{ end -}}
  <script src="{{ $js.RelPermalink }}"{{ if hugo.IsProduction }} integrity="{{ $js.Data.Integrity }}"{{ end }} defer></script>
{{- end -}}

{{- with resources.Get "audio/Stalingrad (Finale).m4a" -}}
<audio id="site-background-music" src="{{ .RelPermalink }}" loop preload="none"></audio>
<button id="site-music-toggle" class="retro-nav-item site-music-toggle" type="button"
        aria-label="Turn background music on" aria-pressed="false">Music: Off</button>
<script src="{{ "js/background-music.js" | relURL }}" defer></script>
{{- end -}}
