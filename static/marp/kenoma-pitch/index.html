<h1 id="kenoma"><strong>kenoma</strong></h1>
<h2 id="b%E1%BA%A3n-pitch--game-designer-%E2%86%92-game-leader"><em>Bản pitch — Game Designer → Game Leader</em></h2>
<h3 id="archive-of-two-truths--survival-horror--philosophical-tragedy">Archive of Two Truths · Survival Horror · Philosophical Tragedy</h3>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-class="bms" data-paginate="true" data-header="Tổng quan" data-theme="kenoma-academic" lang="en-US" class="bms" data-marpit-pagination="2" style="--class:bms;--paginate:true;--header:Tổng quan;--theme:kenoma-academic;" data-marpit-pagination-total="28">
<header>Tổng quan</header>

<p><strong>1. Giới thiệu</strong><br />
<strong>2. Điểm mạnh của game designer</strong><br />
<strong>3. Tổng quan về game</strong><br />
<strong>4. Cốt truyện &amp; Hai thế giới</strong><br />
<strong>5. Cơ chế đột phá — Behavioral Model System</strong><br />
<strong>6. Hai Vanguard</strong><br />
<strong>7. Gameplay Loop &amp; Combat</strong><br />
<strong>8. Puzzle Design</strong><br />
<strong>9. Audio Architecture</strong><br />
<strong>10. Hệ thống Ending</strong><br />
<strong>11. Nguyên lý thiết kế &amp; Trade-offs</strong><br />
<strong>12. Rủi ro &amp; Scope</strong><br />
<strong>13. Yêu cầu &amp; Bước tiếp theo</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-class="puzzle" data-paginate="true" data-header="Giới thiệu" data-theme="kenoma-academic" lang="en-US" class="puzzle" data-marpit-pagination="3" style="--class:puzzle;--paginate:true;--header:Giới thiệu;--theme:kenoma-academic;" data-marpit-pagination-total="28">
<header>Giới thiệu</header>

<ul>
<li>Thiết kế một tựa game đột phá trong dòng survival horror nếu được hiện thực chính xác.</li>
<li>Đúc kết từ các case study trước đây.</li>
<li>Tư tưởng, tư liệu, ý tưởng được trích dẫn có chủ đích, chọn lọc VÀ <strong>SẼ ĐƯỢC HỆ THỐNG</strong>.</li>
</ul>
<blockquote>
<p><strong>Luận điểm cốt lõi:</strong> Không có game nào đã làm điều này. Đây không phải là tuyên bố marketing — đây là kết luận sau khi khảo sát toàn bộ landscape của medium.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-class="demo" data-paginate="true" data-header="Điểm mạnh của game designer" data-theme="kenoma-academic" lang="en-US" class="demo" data-marpit-pagination="4" style="--class:demo;--paginate:true;--header:Điểm mạnh của game designer;--theme:kenoma-academic;" data-marpit-pagination-total="28">
<header>Điểm mạnh của game designer</header>

<ul>
<li>Có thế mạnh về environmental puzzle, stealth game.</li>
<li>Thân thuộc với dòng survival horror.</li>
<li>Có đầu óc nhận xét tốt, mang tính trung lập.</li>
<li>Sáng tạo, ứng biến hiện trạng hiện có (thinking inside the box) thành design tốt.</li>
<li>Kiến thức văn hóa tương đối.</li>
<li>Có mức độ hiểu biết về thể loại alternative history đủ để biết thiết kế như thế nào là <strong>LARPER</strong>, thiết kế như thế nào là tốt và có chiều sâu.</li>
</ul>
<blockquote>
<p><strong>Nói thẳng:</strong> Điểm yếu là kinh nghiệm production. Đó là lý do tôi cần Game Leader — không phải để validate ý tưởng mà để biến nó thành thực tế.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-class="puzzle" data-paginate="true" data-header="Tổng quan game" data-theme="kenoma-academic" lang="en-US" class="puzzle" data-marpit-pagination="5" style="--class:puzzle;--paginate:true;--header:Tổng quan game;--theme:kenoma-academic;" data-marpit-pagination-total="28">
<header>Tổng quan game</header>

<ul>
<li><strong>Thể loại:</strong> Survival horror, environmental puzzle, story-rich</li>
<li><strong>Góc nhìn:</strong> Fixed camera (Alone in the Dark model) — không phải FPS, không phải free-roam 3rd person</li>
<li><strong>Setting:</strong> Kho lưu trữ Ba Tư thời Achaemenid, bị phong ấn 300 năm</li>
<li><strong>Art direction:</strong> Persian Achaemenid — cột đá Apadana, bàn thờ lửa, hành lang đá — khả thi nhất về mặt production và chưa bị khai thác trong medium</li>
<li><strong>Triết học:</strong> Ba giai đoạn Nietzsche (<em>Lạc đà → Sư tử → Đứa trẻ</em>) ẩn trong cấu trúc Act — <strong>không bao giờ nói ra tường minh</strong></li>
</ul>
<blockquote>
<p><strong>Tại sao fixed camera?</strong> Vì architecture tạo ra dread. Alone in the Dark, Tormented Souls, và cả resident evil OG đều chứng minh điều này.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-class="puzzle" data-paginate="true" data-header="Cốt truyện" data-theme="kenoma-academic" lang="en-US" class="puzzle" data-marpit-pagination="6" style="--class:puzzle;--paginate:true;--header:Cốt truyện;--theme:kenoma-academic;" data-marpit-pagination-total="28">
<header>Cốt truyện</header>

<ul>
<li>Người chơi là một <strong>Scholar</strong> — học giả lang thang, không thể ngừng phụng sự — cùng đoàn thám hiểm vào kho lưu trữ bị phong ấn, dẫn đầu bởi <strong>Vanguard</strong>, người nắm tài chính đoàn.</li>
<li>Trong kho, Scholar nhận ra tồn tại <strong>hai thế giới song song</strong> — World A và World B — gần như identical, và bản thể đối lập của Scholar trong thế giới kia đã chết. Scholar không biết mình thuộc thế giới nào.</li>
<li>Mỗi thế giới có <strong>một Vanguard</strong> riêng — cùng người, cùng trí tuệ 300 năm, nhưng hình thành từ hai bối cảnh khác nhau.</li>
<li>Trong suốt hành trình, Scholar xây dựng mối quan hệ thật sự với cả hai Vanguard — <strong>và chính sự đầu tư đó sẽ định hình sức mạnh của họ ở Act cuối.</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-class="crossing" data-paginate="true" data-header="Cốt truyện — Hai thế giới" data-theme="kenoma-academic" lang="en-US" class="crossing" data-marpit-pagination="7" style="--class:crossing;--paginate:true;--header:Cốt truyện — Hai thế giới;--theme:kenoma-academic;" data-marpit-pagination-total="28">
<header>Cốt truyện — Hai thế giới</header>

<h2 id="world-a--sacred-fire-vs-world-b--the-hollow">World A — <em>Sacred Fire</em> <s>vs</s> World B — <em>The Hollow</em></h2>
<table>
<thead>
<tr>
<th></th>
<th>World A · Sacred Fire</th>
<th>World B · The Hollow</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Ánh sáng</strong></td>
<td>Bàn thờ lửa, đèn dầu, ấm áp</td>
<td>Bóng tối hoàn toàn — chỉ có bình lửa của Scholar</td>
</tr>
<tr>
<td><strong>Kiến trúc</strong></td>
<td>Apadana — 72 cột đá, hùng vĩ</td>
<td>Cùng cấu trúc, ngược lại dưới lòng đất</td>
</tr>
<tr>
<td><strong>Vanguard</strong></td>
<td>VA — <em>Sacred Fire</em> · Quân sự, logistics</td>
<td>VB — <em>The Hollow</em> · Triết học, chiêm nghiệm</td>
</tr>
<tr>
<td><strong>Kẻ thù</strong></td>
<td>Fire-Warden (Yazata)</td>
<td>Lantern-Thief (Pairika) — bị hút bởi lửa</td>
</tr>
<tr>
<td><strong>Âm thanh</strong></td>
<td>Đồng thau ấm, tiếng lửa crackle</td>
<td>Gần như im lặng tuyệt đối</td>
</tr>
<tr>
<td><strong>Iron Rule</strong></td>
<td>Nhận <em>kiến thức</em> từ World B</td>
<td>Nhận <em>vật chất</em> từ World A</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Iron Rule không bao giờ bị phá vỡ.</strong> Nếu một puzzle yêu cầu phá quy tắc này — puzzle thay đổi, không phải quy tắc.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-class="wa" data-paginate="true" data-header="Điểm đột phá" data-theme="kenoma-academic" lang="en-US" class="wa" data-marpit-pagination="8" style="--class:wa;--paginate:true;--header:Điểm đột phá;--theme:kenoma-academic;" data-marpit-pagination-total="28">
<header>Điểm đột phá</header>

<ul>
<li><strong>Player xây dựng sức mạnh cho boss cuối</strong> — và cả số phận của boss cuối.<br />
<em>→ Protagonist thực sự của câu chuyện là Vanguard, không phải Scholar.</em></li>
<li>Trải qua <strong>3 giai đoạn Nietzsche</strong> ẩn trong cấu trúc Act — không bao giờ được nói ra tường minh. Cố gắng tinh tế trong việc cài cắm.</li>
<li><strong>Hai thế giới gần như identical</strong> — ban đầu tạo cảm giác bất an khi những action phải lặp lại nhưng lại có cảm giác khác nhau hoàn toàn.</li>
<li><strong>New Game+</strong> không chỉ là tìm ending khác — là chọn <em>cách</em> final confrontation diễn ra, <em>sức mạnh nào</em> Vanguard mang vào.</li>
</ul>
<blockquote>
<p><strong>Concept thử nghiệm:</strong> Nếu thành công, đây là sub-genre mới — NPC được player <em>build</em> lên nhưng không phải companion, không phải Nemesis. Độc lập hơn. Hành động trong giới hạn khả năng đã được trao.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-class="bms" data-paginate="true" data-header="Cơ chế đột phá — Behavioral Model System" data-theme="kenoma-academic" lang="en-US" class="bms" data-marpit-pagination="9" style="--class:bms;--paginate:true;--header:Cơ chế đột phá — Behavioral Model System;--theme:kenoma-academic;" data-marpit-pagination-total="28">
<header>Cơ chế đột phá — Behavioral Model System</header>

<h2 id="bms--behavioral-model-system">BMS — Behavioral Model System</h2>
<p>Đây là <strong>cột sống</strong> của toàn bộ game. Vanguard không phản ứng theo <em>hành động cuối cùng</em> của Scholar — cô ấy dự đoán <em>hành động tiếp theo</em> dựa trên model hành vi đã tích lũy từ đầu game.</p>
<p><strong>Cách hoạt động:</strong></p>
<ul>
<li>Mọi quyết định của Scholar đều được ghi lại — <strong>âm thầm, không UI, không thông báo</strong></li>
<li>Hệ thống track 12 loại event: <code>DeepRead</code>, <code>ResourceDonate</code>, <code>VoluntaryCrossing</code>, <code>CombatTier</code>, <code>PuzzleSolved</code>, <code>VanguardAddressed</code>...</li>
<li>Hai register độc lập: <code>wa_warmth</code> và <code>vb_warmth</code> — <strong>không bao giờ hiển thị với player</strong></li>
<li>Player đọc được BMS <strong>chỉ qua một kênh duy nhất:</strong> hành vi quan sát được của Vanguard</li>
</ul>
<blockquote>
<p><strong>Nguyên tắc cốt lõi:</strong> Player không thể <em>thấy</em> model. Nhưng player có thể <em>cảm thấy</em> nó qua việc sự phát triển của cả 2 Vanguard</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-class="compact bms" data-paginate="true" data-header="BMS — 5 Recognition Stages" data-theme="kenoma-academic" lang="en-US" class="compact bms" data-marpit-pagination="10" style="--class:compact bms;--paginate:true;--header:BMS — 5 Recognition Stages;--theme:kenoma-academic;" data-marpit-pagination-total="28">
<header>BMS — 5 Recognition Stages</header>

<h2 id="vanguard-h%E1%BB%8Dc-scholar-qua-5-giai-%C4%91o%E1%BA%A1n--quan-s%C3%A1t-%C4%91%C6%B0%E1%BB%A3c-b%E1%BA%B1ng-h%C3%A0nh-vi-kh%C3%B4ng-bao-gi%E1%BB%9D-%C4%91%C6%B0%E1%BB%A3c-th%C3%B4ng-b%C3%A1o">Vanguard học Scholar qua 5 giai đoạn — quan sát được bằng hành vi, không bao giờ được thông báo</h2>
<table>
<thead>
<tr>
<th>Stage</th>
<th>Hành vi của Vanguard</th>
<th>Dấu hiệu quan sát được</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>S1</strong></td>
<td>Đặt câu hỏi — cần thông tin</td>
<td>Hỏi về phương pháp, thời gian, quyết định</td>
</tr>
<tr>
<td><strong>S2</strong></td>
<td>Ngừng hỏi phương pháp</td>
<td>Biết cách Scholar làm việc rồi. Chỉ còn nói kết quả</td>
</tr>
<tr>
<td><strong>S3</strong></td>
<td>Dự đoán &amp; chuẩn bị trước</td>
<td>Đặt dầu ở nơi Scholar sẽ cần, trước khi Scholar hỏi</td>
</tr>
<tr>
<td><strong>S4</strong></td>
<td>Trả lời trước khi được hỏi xong</td>
<td><em>&quot;Bạn muốn hỏi về hành lang đông — phải không.&quot;</em></td>
</tr>
<tr>
<td><strong>S5 ⚠</strong></td>
<td>Chỉ quan sát. Không còn cần học</td>
<td>Model đã hoàn chỉnh. <strong>Đây là giai đoạn nguy hiểm nhất.</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>S5 là điểm không thể quay lại.</strong> Khi Vanguard đạt S5, công việc của Scholar — theo định nghĩa của cô — đã xong.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-class="va" data-paginate="true" data-header="Nhân vật — Vanguard A · Sacred Fire" data-theme="kenoma-academic" lang="en-US" class="va" data-marpit-pagination="11" style="--class:va;--paginate:true;--header:Nhân vật — Vanguard A · Sacred Fire;--theme:kenoma-academic;" data-marpit-pagination-total="28">
<header>Nhân vật — Vanguard A · Sacred Fire</header>

<h2 id="south-entrance-the-oil-is-there"><em>&quot;South entrance. The oil is there.&quot;</em></h2>
<p><strong>VA — Sacred Fire</strong> · Trí tuệ quân sự · 300 năm kiên nhẫn</p>
<ul>
<li><strong>Tư duy:</strong> Logistics thuần túy. Cô đánh giá mọi thứ như bài toán vận hành. Sự ấm áp của cô được biểu hiện qua <em>hiệu quả</em> — đặt đúng lượng dầu được tính từ việc theo dõi Scholar 3 năm trước khi họ đến.</li>
<li><strong>Không bao giờ:</strong> Xin lỗi. Bày tỏ nghi ngờ về kết luận của mình. Dùng từ ngữ cảm xúc.</li>
<li><strong>Clause 18:</strong> Khi model hoàn chỉnh, VA sẽ nói thẳng với Scholar điều sắp xảy ra — rõ ràng như bản tóm tắt quân sự — rồi bước đi. Không có sự tàn nhẫn. Không có sự ấm áp. Chỉ có độ chính xác.</li>
</ul>
<blockquote>
<p><em>&quot;When the Archive is complete, the Scholar who completed it will no longer be necessary. This is Clause 18. I have told you this.&quot;</em> — Rồi cô bước đi để thực thi.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-class="vb" data-paginate="true" data-header="Nhân vật — Vanguard B · The Hollow" data-theme="kenoma-academic" lang="en-US" class="vb" data-marpit-pagination="12" style="--class:vb;--paginate:true;--header:Nhân vật — Vanguard B · The Hollow;--theme:kenoma-academic;" data-marpit-pagination-total="28">
<header>Nhân vật — Vanguard B · The Hollow</header>

<h2 id="ba-ng%C3%A0y-tr%C6%B0%E1%BB%9Bc-anh-n%C3%B3i-c%C3%A1c-ch%E1%BB%AF-kh%E1%BA%AFc-mang-t%C3%ADnh-h%C3%A0nh-ch%C3%ADnh-t%C3%B4i-%C4%91%C3%A3-suy-ngh%C4%A9-v%E1%BB%81-%C4%91i%E1%BB%81u-%C4%91%C3%B3-t%C3%B4i-ngh%C4%A9-ch%C3%BAng-mang-t%C3%ADnh-ki%E1%BA%BFn-tr%C3%BAc"><em>&quot;Ba ngày trước anh nói các chữ khắc mang tính hành chính. Tôi đã suy nghĩ về điều đó. Tôi nghĩ chúng mang tính kiến trúc.&quot;</em></h2>
<p><strong>VB — The Hollow</strong> · Trí tuệ triết học · 300 năm cô đơn với ý tưởng</p>
<ul>
<li><strong>Tư duy:</strong> Sự kiên nhẫn triết học. Cô đã tự học tiếng Babylon trong 8 năm để hiểu Scholar khi họ đến. Sự ấm áp của cô là <em>sự thân mật trí tuệ</em> — chia sẻ điều chưa bao giờ nói vì không có ai để kể.</li>
<li><strong>Không bao giờ:</strong> Bộc lộ tức giận. Vội vàng. Xin lỗi về kết luận của mình.</li>
<li><strong>Khi Scholar chọn ngược lại:</strong> <em>&quot;Một lựa chọn hợp lý.&quot;</em> — Rồi cô viết. Nếu Scholar tìm được cuốn sách ấy sau, họ thấy một bản phân tích chính xác, không cảm xúc về <em>chính quyết định của họ.</em> Đáng sợ hơn cả cơn giận.</li>
</ul>
<blockquote>
<p>VB nói nhiều hơn VA — câu phức, mệnh đề phụ. Cô đang tinh chỉnh ý tưởng ngay khi nói. Nhưng không một từ nào bị lãng phí.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-class="crossing" data-paginate="true" data-header="Gameplay — Traversal System" data-theme="kenoma-academic" lang="en-US" class="crossing" data-marpit-pagination="13" style="--class:crossing;--paginate:true;--header:Gameplay — Traversal System;--theme:kenoma-academic;" data-marpit-pagination-total="28">
<header>Gameplay — Traversal System</header>

<h2 id="h%E1%BB%87-th%E1%BB%91ng-di-chuy%E1%BB%83n-gi%E1%BB%AFa-hai-th%E1%BA%BF-gi%E1%BB%9Bi">Hệ thống di chuyển giữa hai thế giới</h2>
<p>Mỗi lần Scholar vượt ranh giới: <code>traversalDebt++</code>. <strong>Vanguard không bao giờ vượt.</strong> Debt của họ luôn bằng 0. Sự bất đối xứng này nhìn thấy được từ phút đầu tiên.</p>
<table>
<thead>
<tr>
<th>Debt</th>
<th>Hậu quả</th>
<th>Thời gian</th>
<th>Ghi chú</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>Không có</td>
<td>—</td>
<td>Lần đầu — chỉ cảm giác kỳ lạ</td>
</tr>
<tr>
<td>2</td>
<td>Boundary xuất hiện</td>
<td>8 giây</td>
<td>Dread thuần túy — Scholar chưa nguy hiểm</td>
</tr>
<tr>
<td>3</td>
<td>Boundary truy đuổi</td>
<td>20 giây</td>
<td>Bắt đầu tính toán</td>
</tr>
<tr>
<td>4+</td>
<td>Boundary tồn tại liên tục</td>
<td>Cho đến khi save</td>
<td>Không thể bỏ qua</td>
</tr>
</tbody>
</table>
<p><strong>Iron Rule qua mỗi Traversal Focal Point (TFP):</strong><br />
<em>Kiến thức World B → mở khóa hành động World A · Vật liệu World A → thay đổi vật lý World B</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-class="wa" data-paginate="true" data-header="Gameplay — Combat &amp; Resource" data-theme="kenoma-academic" lang="en-US" class="wa" data-marpit-pagination="14" style="--class:wa;--paginate:true;--header:Gameplay — Combat &amp; Resource;--theme:kenoma-academic;" data-marpit-pagination-total="28">
<header>Gameplay — Combat &amp; Resource</header>

<h2 id="ba-t%E1%BA%A7ng-chi%E1%BA%BFn-%C4%91%E1%BA%A5u--kh%C3%B4ng-c%C3%B3-t%E1%BA%A7ng-n%C3%A0o-l%C3%A0-%C4%91%C3%BAng">Ba tầng chiến đấu — Không có tầng nào là &quot;đúng&quot;</h2>
<p><strong>Tier 1 — Environmental:</strong> Bẫy, bóng tối, chướng ngại vật. Không cần tài nguyên.</p>
<p><strong>Tier 2 — Fire &amp; Arms:</strong> Bình lửa (dầu), nỏ (crossbow bolts), chuông cộng hưởng (bell). Tốn tài nguyên khan hiếm.</p>
<p><strong>Tier 3 — Naming:</strong> Đọc inscription gốc của sinh vật → nói tên chính thức trong tiếng Avestan → sinh vật đó <strong>không còn thù địch vĩnh viễn.</strong> Chi phí: chỉ là thời gian và kiến thức đọc trước đó.</p>
<blockquote>
<p><strong>Naming là tầng mạnh nhất và rẻ nhất — nhưng yêu cầu Scholar phải đã đọc sâu (deep-read) inscription của sinh vật đó.</strong> Điều này là thiết kế có chủ đích: khuyến khích khám phá thực sự, không phải grind.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-class="puzzle" data-paginate="true" data-header="Puzzle Design — Nguyên tắc Authorship" data-theme="kenoma-academic" lang="en-US" class="puzzle" data-marpit-pagination="15" style="--class:puzzle;--paginate:true;--header:Puzzle Design — Nguyên tắc Authorship;--theme:kenoma-academic;" data-marpit-pagination-total="28">
<header>Puzzle Design — Nguyên tắc Authorship</header>

<h2 id="kh%C3%B4ng-c%C3%B3-puzzle-n%C3%A0o-kh%C3%B4ng-c%C3%B3-t%C3%A1c-gi%E1%BA%A3">Không có puzzle nào không có tác giả</h2>
<p><strong>Quy tắc thiết kế bắt buộc:</strong> Trước khi implement bất kỳ puzzle nào, phải trả lời đủ 4 câu hỏi:</p>
<blockquote>
<p><strong>Ai đã xây dựng cơ chế này?</strong> <em>(một người cụ thể trong lịch sử của kho lưu trữ)</em><br />
<strong>Họ cần nó làm gì?</strong> <em>(mục đích thực tế trong thế giới — không phải &quot;đây là puzzle cho player&quot;)</em><br />
<strong>Điều gì đã xảy ra, hoặc bí mật nào nó lưu giữ?</strong> <em>(tại sao Scholar tìm thấy nó ở trạng thái này sau 300 năm)</em><br />
<strong>Iron Rule áp dụng như thế nào?</strong> <em>(kiến thức và vật liệu chạy theo hướng nào qua puzzle này)</em></p>
</blockquote>
<p>Nếu không trả lời được 4 câu → <strong>puzzle chưa sẵn sàng để build.</strong></p>
<p><em>&quot;Phòng này cần một puzzle&quot;</em> không bao giờ là lý do hợp lệ.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-class="audio" data-paginate="true" data-header="Audio Architecture — Dark Voice" data-theme="kenoma-academic" lang="en-US" class="audio" data-marpit-pagination="16" style="--class:audio;--paginate:true;--header:Audio Architecture — Dark Voice;--theme:kenoma-academic;" data-marpit-pagination-total="28">
<header>Audio Architecture — Dark Voice</header>

<h2 id="dark-voice--gi%E1%BB%8Dng-n%E1%BB%99i-t%C3%A2m-chi%E1%BA%BFn-l%C6%B0%E1%BB%A3c-c%E1%BB%A7a-scholar">Dark Voice — Giọng nội tâm chiến lược của Scholar</h2>
<p>Dark Voice <strong>không phải</strong> hiệu ứng reverb. Không phải 2D audio. Không phải lồng ghép hậu kỳ.<br />
Đây là giọng của Scholar — <strong>trí tuệ chiến lược Đông Chu của họ</strong> — nổi lên khi họ đang chọn không nhìn thẳng vào sự thật.</p>
<p><strong>Ba nguồn gốc không gian — thiết lập từ ngày đầu tiên, mỗi câu thoại đều có:</strong></p>
<table>
<thead>
<tr>
<th>Nguồn gốc</th>
<th>Ý nghĩa</th>
<th>Khi nào dùng</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Behind</strong> · <em>Phía sau</em></td>
<td>Suy nghĩ Scholar đã kìm nén</td>
<td>Nhận ra điều đã tránh né</td>
</tr>
<tr>
<td><strong>Beside</strong> · <em>Bên cạnh</em></td>
<td>Phân tích song song với hành động hiện tại</td>
<td>Quan sát về điều Scholar đang làm</td>
</tr>
<tr>
<td><strong>Ahead</strong> · <em>Phía trước</em></td>
<td>Cảnh báo về điều sắp làm</td>
<td>Trước một lựa chọn không thể đảo ngược</td>
</tr>
</tbody>
</table>
<blockquote>

<header>Hệ thống Ending — 5 Kịch bản</header>

<h2 id="act-iii-thu%E1%BB%99c-v%E1%BB%81-vanguard--kh%C3%B4ng-ph%E1%BA%A3i-scholar">Act III thuộc về Vanguard — không phải Scholar</h2>
<p>Scholar đã ra đi. Player nhìn Vanguard đi qua từng phòng Scholar đã làm việc.</p>
<table>
<thead>
<tr>
<th>Scenario</th>
<th>BMS Range</th>
<th>Thể loại</th>

<tr>
<td><strong>I</strong></td>
<td>Warmth thấp</td>
<td>Trống rỗng</td>

</tr>
<tr>
<td><strong>II</strong></td>
<td>Trung thấp</td>
<td>Đau buồn</td>
<td>Cô dừng lại ở một phòng lâu hơn. Không làm gì. Rồi đi tiếp.</td>
</tr>
<tr>
<td><strong>III</strong></td>
<td>Trung</td>
<td>Kính trọng</td>
<td>Cô đóng nhật ký của Scholar lại. Đặt vào cặp theo đúng thứ tự <em>của Scholar</em>, không phải của cô.</td>
</tr>

<tr>

<p>Scenario V không phải ending tốt. Đó là ending mà cả hai trở thành chính họ — <em>thông qua nhau.</em></p>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-class="crossing" data-paginate="true" data-header="Nguyên lý rút ra - Stanley Kubrick" data-theme="kenoma-academic" lang="en-US" class="crossing" data-marpit-pagination="20" style="--class:crossing;--paginate:true;--header:Nguyên lý rút ra - Stanley Kubrick;--theme:kenoma-academic;" data-marpit-pagination-total="28">
<header>Nguyên lý rút ra - Stanley Kubrick</header>

<ul>
<li><em>If it can be said in words, it doesn't belong in the film.</em></li>
<li><em>Camera placement is the director's most powerful statement.</em></li>
<li><em>Never show what can be implied — imagination is more powerful.</em></li>
<li><em>Every shot must have a reason or it has no right to exist.</em></li>
<li><strong>Anti-Totalitarian Philosophy.</strong></li>
<li><strong>Trade off and Mutually Exclusive</strong></li>
</ul>
<blockquote>
<p><strong>Áp dụng trực tiếp:</strong> BMS không hiển thị → Boundary không giải thích → Dark Voice không kể câu chuyện → Ending không phán xét. Mọi thứ được <em>đọc</em>, không được <em>nói</em>.</p>
</blockquote>
</section>

<h2 id="th%E1%BB%A9-t%E1%BB%B1-build--kh%C3%B4ng-th%E1%BB%83-%C4%91%E1%BA%A3o-ng%C6%B0%E1%BB%A3c">Thứ tự build — Không thể đảo ngược</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>SYS-01 BMS  →  SYS-02 RSS  →  SYS-03 TDS  →  SYS-04 TVS
   →  SYS-05 RES  →  SYS-07 TCS  →  SYS-08 SRS  →  SYS-06 USS
</code></pre>
<p><strong>BMS phải được build trước.</strong> USS (Utility Score System — thứ quyết định khi nào Vanguard chuyển sang Hunt mode) phải được build cuối cùng — sau khi RSS, TDS, và TVS đã ổn định.</p>
<p><strong>Demo target:</strong> Một scene duy nhất — Resonance Obelisk với 3 solution path. Playtester phải có thể nói: <em>&quot;Vanguard đối xử với tôi khác đi dựa trên lựa chọn của tôi&quot;</em> — <strong>không cần được nhắc.</strong></p>
<p>Nếu demo pass tiêu chí này → full production justified.<br />
Nếu demo fail → chúng ta biết cụ thể cần fix gì trước khi đầu tư thêm.</p>
</section>

<h2 id="nh%E1%BB%AFng-g%C3%AC-t%C3%B4i-c%E1%BA%A7n-%C4%91%E1%BB%83-ti%E1%BA%BFn-ti%E1%BA%BFp">Những gì tôi cần để tiến tiếp</h2>
<p><strong>Quyết định cần từ buổi này:</strong></p>
<ul>
<li><strong>Green-light demo scene</strong> — Resonance Obelisk, 1 puzzle, 3 solution paths, BMS wired.</li>
<li><strong>Team tối thiểu cho demo:</strong> 1 programmer (Unity 6 URP + FMOD), 1 artist (environment — Persian stone, fire VFX), 1 audio designer (binaural FMOD setup).</li>
<li><strong>Timeline demo:</strong> 6–8 tuần từ ngày bắt đầu.</li>
</ul>
<p><strong>Những gì tôi <em>không</em> cần:</strong></p>
<ul>
<li>Validation rằng ý tưởng hay — điều đó đã được research xác nhận.</li>
<li>Thêm features trước khi demo — scope creep giết chết proof-of-concept.</li>
</ul>
<blockquote>
<p><strong>Câu hỏi duy nhất cần trả lời hôm nay:</strong> Demo có được build không?</p>
</blockquote>

<h2 id="b%E1%BA%A3n-pitch-k%E1%BA%BFt-th%C3%BAc-t%E1%BA%A1i-%C4%91%C3%A2y"><em>Bản pitch kết thúc tại đây.</em></h2>
